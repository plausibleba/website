<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>complexity_chips_strip — Coastline Super Example</title>
<!--
  Self-contained example render for complexity_chips_strip v1.0.
  Uses Coastline Super fixture data inlined as window.widgetData.
  Opens directly in a browser — no server required.

  Fixture sources:
    - manifest: derived from fixtures/coastline-super/ bundle metadata
    - workshopContext: fixtures/coastline-super/workshop-context.json (bindingConstraint.label)
    - charter: first charter from coastline-super-vcc-bundle.json
      (regulatoryAnchors from dec_beneficiary_determination, aesClassification inferred)

  Note: Coastline bundle does not have aesClassification at charter level in v1 scaffold.
  Widget renders '—' for chip 4 and shows the absent state correctly.
-->
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../base.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>

<!-- Inject Coastline Super fixture data -->
<script>
window.widgetData = {
  manifest: {
    manifestVersion: 1,
    canonicalBundleHash: "a4f9e2b1c83d7056f21e4a9b3c8d1f5e6a7b2c9d4e5f0a1b2c3d4e5f6a7b8c9",
    builtAt: "2026-05-19T00:00:00.000Z",
    charterVersion: 1,
    userStories: {
      filePath: "stories.jsonld",
      sha256: "b5e8f3c2d1a0796e4f3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1",
      storyCount: 12,
      derivedFromFrictionIds: [
        "fr_p1_intake_to_team_queue",
        "fr_p2_generalist_intake",
        "fr_p3_multi_cycle_documents",
        "fr_p4_state_scattered_eight_systems",
        "fr_p5_reactive_comms",
        "fr_p6_no_trauma_informed_intake",
        "fr_p7_manual_beneficiary_trace",
        "fr_p8_parallel_insurer_invisible",
        "fr_p9_187_day_median_time_to_payment"
      ]
    }
  },
  workshopContext: {
    bindingConstraint: {
      label: "Death Claim Cycle Time — 187-Day Median",
      description: "The 187-day median time-to-payment is the aggregate expression of four compounding frictions: a 48-hour intake queue, three document-gathering cycles, a reactive comms model, and state scattered across eight systems.",
      valueStreamStageRef: "act_vs_001_s03_evidence_assembled"
    }
  },
  charter: {
    "@type": "vcc:AgentCharter",
    "@id": "urn:vcc:charter:coastline-super-death-benefit-claim-intake",
    "name": "Death Benefit Claim Intake Agent",
    "regulatoryAnchors": [
      { "@type": "vcc:RegulatoryAnchor", "regulator": "ASIC", "reference": "ASIC RG 277 — death claim handling timeliness expectations" },
      { "@type": "vcc:RegulatoryAnchor", "regulator": "ASIC", "reference": "ASIC RG 271 — IDR requirements (90-day response)" },
      { "@type": "vcc:RegulatoryAnchor", "regulator": "SIS", "reference": "SIS Act 1993 s101 — trustee discretion in discretionary determinations" },
      { "@type": "vcc:RegulatoryAnchor", "regulator": "SIS", "reference": "SIS Act 1993 s59A — binding death benefit nominations" },
      { "@type": "vcc:RegulatoryAnchor", "regulator": "AFCA", "reference": "AFCA Rules — complaint jurisdiction and timeliness" }
    ]
    // aesClassification is absent in the Coastline v1 scaffold bundle — chip 4 renders the absent state ('—')
  }
};
</script>

<div class="widget-root">

  <!-- Example header — not part of the widget itself -->
  <div style="margin-bottom: 24px; font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); letter-spacing: 0.04em;">
    EXAMPLE RENDER · complexity_chips_strip v1.0 · Coastline Super — Death Benefit Claim Intake
  </div>

  <!-- Widget mount point -->
  <div id="widget-mount"></div>

  <!-- Context note — not part of the widget -->
  <div style="margin-top: 20px; font-size: 11px; color: var(--ink-4); line-height: 1.6;">
    Source: fixtures/coastline-super/ · 9 friction IDs · 5 regulatory anchors · AES: absent in v1 scaffold (chip 4 shows —)
  </div>

</div>

<!-- Widget script (identical to index.html — inlined for self-contained render) -->
<script>
(function () {
  'use strict';

  var mount = document.getElementById('widget-mount');
  var data = window.widgetData;
  if (!data) {
    mount.innerHTML = '<div class="widget-error">complexity_chips_strip: window.widgetData is required.</div>';
    return;
  }

  var wc      = data.workshopContext || {};
  var charter = data.charter || {};
  var mf      = data.manifest || {};

  var bindingLabel = (wc.bindingConstraint && wc.bindingConstraint.label)
    ? wc.bindingConstraint.label : null;

  var frictionCount = null;
  if (mf.userStories && Array.isArray(mf.userStories.derivedFromFrictionIds)) {
    frictionCount = mf.userStories.derivedFromFrictionIds.length;
  } else if (charter.provenance && charter.provenance.derivedFrom &&
             Array.isArray(charter.provenance.derivedFrom.derivedFromFrictionIds)) {
    frictionCount = charter.provenance.derivedFrom.derivedFromFrictionIds.length;
  }

  var regAnchorCount = Array.isArray(charter.regulatoryAnchors)
    ? charter.regulatoryAnchors.length : null;

  var aesClass = (typeof charter.aesClassification === 'string')
    ? charter.aesClassification : null;

  function absent() { return '<span class="ccs-absent">—</span>'; }

  var chip1Html = [
    '<div class="complexity-chip">',
    '  <div class="ccs-label">Binding Constraint</div>',
    '  <div class="ccs-value">',
    bindingLabel ? '<span class="accent">1</span> · ' + bindingLabel : absent(),
    '  </div>',
    '</div>'
  ].join('\n');

  var chip2Html = [
    '<div class="complexity-chip">',
    '  <div class="ccs-label">Mapped Frictions</div>',
    '  <div class="ccs-value">',
    frictionCount !== null ? '<span class="accent">' + frictionCount + '</span> observations' : absent(),
    '  </div>',
    '</div>'
  ].join('\n');

  var chip3Html = [
    '<div class="complexity-chip">',
    '  <div class="ccs-label">Regulatory Anchors</div>',
    '  <div class="ccs-value">',
    regAnchorCount !== null ? '<span class="accent">' + regAnchorCount + '</span> anchors' : absent(),
    '  </div>',
    '</div>'
  ].join('\n');

  var chip4Html = [
    '<div class="complexity-chip">',
    '  <div class="ccs-label">AES Classification</div>',
    '  <div class="ccs-value">',
    aesClass ? '<span class="accent">' + aesClass + '</span>' : absent(),
    '  </div>',
    '</div>'
  ].join('\n');

  mount.innerHTML = [
    '<div class="chips-strip" role="region" aria-label="Complexity summary chips">',
    chip1Html,
    chip2Html,
    chip3Html,
    chip4Html,
    '</div>'
  ].join('\n');

})();
</script>

</body>
</html>
