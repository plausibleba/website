<title>bundle_metric_strip — Coastline Super Example</title>
<!--
  Self-contained example render for bundle_metric_strip v1.0.
  Uses Coastline Super fixture data derived from:
    fixtures/coastline-super/coastline-super-vcc-bundle.json
    fixtures/coastline-super/stories.jsonld

  Representative manifest — Coastline Super has no real export yet (scaffold only).
  Counts are REAL from fixture files:
    - storyCount: 12 (confirmed from stories.jsonld — 12 UserStory @type entries)
    - derivedFromFrictionIds: 12 (fr_p1 through fr_p12, one per story)
    - charterVersion: 1 (scaffold v1)
    - hash: canonical placeholder until real export run
-->
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../base.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>

<!-- Inject Coastline Super fixture data -->
<script>

    canonicalBundleHashAlgorithm: "sha256",

    charterVersion: 1,
    derivedProfiles: [],
    userStories: {

      collectionUrn: "urn:vcc:stories:coastline-super-death-benefit-claim-intake:v1",

        "urn:vcc:user-story:story-f1152349",

        "urn:vcc:user-story:story-d845cc0a",
        "urn:vcc:user-story:story-ee2f622e",

      derivedFromFrictionIds: [

<div class="widget-root">

  <!-- Example header — not part of the widget itself -->
  <div style="margin-bottom: 24px; font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); letter-spacing: 0.04em;">

  </div>

  <!-- Widget mount point -->
  <div id="widget-mount"></div>

  <!-- Context note — not part of the widget -->
  <div style="margin-top: 20px; font-size: 11px; color: var(--ink-4); line-height: 1.6;">
    Source: fixtures/coastline-super/ · Representative manifest (no real export yet) · 12 stories (stories.jsonld confirmed) · 12 friction IDs (fr_p1–fr_p12) · Hash is placeholder until real export run
  </div>

</div>

<!-- Widget script (identical to index.html — inlined for self-contained render) -->
<script>
(function () {
  'use strict';

  var mount = document.getElementById('widget-mount');
  var data = window.widgetData;
  if (!data || !data.manifest) {
    mount.innerHTML = '<div class="widget-error">bundle_metric_strip: window.widgetData.manifest is required.</div>';
    return;
  }

  var m = data.manifest;
  var hash    = typeof m.canonicalBundleHash === 'string' ? m.canonicalBundleHash : null;
  var builtAt = typeof m.builtAt === 'string' ? m.builtAt : null;
  var version = typeof m.charterVersion === 'number' ? m.charterVersion : null;
  var stories = m.userStories || null;
  var storyCount    = stories ? stories.storyCount : null;
  var frictionCount = stories && Array.isArray(stories.derivedFromFrictionIds)
    ? stories.derivedFromFrictionIds.length : null;

  function fmtHash(h) {
    if (!h) return '<span class="bms-absent">—</span>';
    return '<span class="bms-value mono">' + h.slice(0, 12) + '…</span>';
  }
  function fmtDate(iso) {
    if (!iso) return '<span class="bms-absent">—</span>';
    return '<span class="bms-value">' + iso.slice(0, 10) + '</span>';
  }
  function fmtVersion(v) {
    if (v === null || v === undefined) return '<span class="bms-absent">—</span>';
    return '<span class="bms-value">v' + v + '</span>';
  }
  function fmtCount(n) {
    if (n === null || n === undefined) return '<span class="bms-value bms-absent">—</span>';
    return '<span class="bms-value">' + n + '</span>';
  }

  var html = [
    '<div class="bundle-metric-strip" role="region" aria-label="Bundle provenance metrics">',
    '  <div class="bms-cell">',
    '    <div class="bms-label">Bundle Hash</div>',
    '    ' + fmtHash(hash),
    '    <div class="bms-note">sha256 · drift anchor</div>',
    '  </div>',
    '  <div class="bms-cell">',
    '    <div class="bms-label">Exported</div>',
    '    ' + fmtDate(builtAt),
    '    <div class="bms-note">manifest.builtAt</div>',
    '  </div>',
    '  <div class="bms-cell">',
    '    <div class="bms-label">Charter Version</div>',
    '    ' + fmtVersion(version),
    '    <div class="bms-note">charterVersion</div>',
    '  </div>',
    '  <div class="bms-cell">',
    '    <div class="bms-label">User Stories</div>',
    '    ' + fmtCount(storyCount),
    '    <div class="bms-note">stories.jsonld</div>',
    '  </div>',
    '  <div class="bms-cell">',
    '    <div class="bms-label">Friction IDs</div>',
    '    ' + fmtCount(frictionCount),
    '    <div class="bms-note">derivedFromFrictionIds</div>',
    '  </div>',
    '</div>'
  ].join('\n');

  mount.innerHTML = html;
})();
</script>

</body>
</html>
