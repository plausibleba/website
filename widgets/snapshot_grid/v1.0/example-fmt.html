  Opens directly in a browser — no server required.

  Fixture source: authored from fixtures/FMT/se-briefing/04.5a-fmt-diagnostic.html
  Note: replace with real workshopContext when FMT workshop-context.jsonld is authored.
-->
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../base.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>

<script>

  workshopContext: {

<div class="widget-root">

  <!-- Example header — not part of the widget itself -->
  <div style="margin-bottom: 24px; font-size: 11px; color: var(--ink-4); font-family: var(--font-mono); letter-spacing: 0.04em;">
    EXAMPLE RENDER · snapshot_grid v1.0 · First Mortgage Trust — Credit Write-Up Agent · plausible fixture data
  </div>

  <!-- Widget mount point -->
  <div id="widget-mount"></div>

  <!-- Context note — not part of the widget -->
  <div style="margin-top: 20px; font-size: 11px; color: var(--ink-4); line-height: 1.6;">
    Note: FMT workshop-context.jsonld not yet authored — data sourced from 04.5a-fmt-diagnostic.html + known business context.
    Replace with real workshopContext when available.
  </div>

<!-- Widget script (identical to index.html — inlined for self-contained render) -->
<script>
(function () {
  'use strict';

  var mount = document.getElementById('widget-mount');
  var data = window.widgetData;
  if (!data || !data.workshopContext ||
      !data.workshopContext.businessSnapshot ||
      !Array.isArray(data.workshopContext.businessSnapshot.metrics)) {
    mount.innerHTML = '<div class="widget-error">snapshot_grid: window.widgetData.workshopContext.businessSnapshot.metrics[] is required.</div>';
    return;
  }

  var metrics = data.workshopContext.businessSnapshot.metrics;

  function trendArrow(direction) {
    if (!direction || direction === 'n/a') return '';
    var arrow = direction === 'up' ? '▲' : direction === 'down' ? '▼' : '—';
    var cls = 'sg-trend trend-' + direction;
    return '<span class="' + cls + '" aria-label="trend ' + direction + '">' + arrow + '</span>';
  }

  function renderCard(metric) {
    var label    = metric.label || '';
    var rawValue = (metric.value !== undefined && metric.value !== null) ? metric.value : null;
    var unit     = metric.unit || '';
    var note     = metric.note || '';
    var trend    = metric.trendDirection || '';

    var valueHtml = (rawValue !== null)
      ? '<span class="sg-value">' + rawValue + '</span>'
      : '<span class="sg-absent">—</span>';

    var unitHtml = unit
      ? '<span class="sg-unit">' + unit + '</span>'
      : '';

    var noteHtml = note
      ? '<div class="sg-note">' + note + '</div>'
      : '';

    return [
      '<div class="sg-card">',
      trendArrow(trend),
      '  <div class="sg-label">' + label + '</div>',
      '  <div class="sg-value-row">' + valueHtml + unitHtml + '</div>',
      noteHtml,
      '</div>'
    ].join('\n');
  }

  var cards = metrics.map(renderCard).join('\n');
  var html = [
    '<div class="snapshot-grid" role="region" aria-label="Business snapshot metrics">',
    cards,
    '</div>'
  ].join('\n');

  mount.innerHTML = html;
})();
</script>

</body>
</html>
